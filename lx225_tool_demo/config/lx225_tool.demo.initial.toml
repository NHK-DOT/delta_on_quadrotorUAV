# LX225 工具示例配置
# 目标：
# 1. 把常用参数尽量放到配置文件里，不要每次在命令行写一长串参数。
# 2. 把“硬件读写目标”和“本地映射显示规则”分开。
# 3. 本地映射只影响显示和换算，不会让舵机运动。
#
# 约定：
# 1. `raw_*` 是舵机协议里的原始位置值，通常可理解为官方软件看到的 0..1000。
# 2. `mapped_angle_*` 是你自己定义的角度坐标系，不必等于官方 0..240°。
# 3. `position_step` 是你希望量化到的原始步长。
#    - 1  表示最细
#    - 5  表示每 5 个 raw 量化一步
#    - 10 表示接近官方 UI 的常见步进

[serial]
# 实际连接舵机驱动板的串口。
# 注意不要填成 IMU 的串口。
# 结合当前机器的枚举结果，舵机驱动板当前是 COM19。
port = "COM19"

# 波特率。
# 这里按当前实测值 9600 写。
baudrate = 9600

# 串口读超时，单位秒。
timeout = 0.60

# 打开串口后的额外等待时间，单位秒。
# 某些 USB 转串口板刚打开时需要一点稳定时间。
connect_delay = 1.00

[defaults]
# 全局默认量化步长。
# 如果某个舵机没有单独写 `position_step`，就用这里的默认值。
position_step = 4

[servos.servo1]
# 逻辑名字。
# `servo1` 只是示例名，后面可以改成更有意义的名字，
# 例如 `delta_a`、`delta_b`、`delta_c`。
#
# 当前舵机 ID。
id = 1

# 这个舵机自己的量化步长。
# 如果和 [defaults] 一样，也建议显式写出来，方便一眼看懂。
position_step = 4

# 你希望这个舵机在“自定义映射”里采用的原始最小值。
# 这不一定等于舵机内部限位，它只是映射参考范围。
raw_min = 0

# 你希望这个舵机在“自定义映射”里采用的原始最大值。
raw_max = 1000

home_raw = 750
startup_check_raw = 750

# 当原始值等于 raw_min 时，对应你定义的角度值。
# 当前主线映射用 0..1000 坐标，raw=0 对应 0。
mapped_angle_at_raw_min = 0.0

# 当原始值等于 raw_max 时，对应你定义的角度值。
# 当前主线映射用 0..1000 坐标，raw=1000 对应 1000。
mapped_angle_at_raw_max = 1000.0

[servos.servo2]
# 第二个舵机示例。
id = 2
position_step = 4
raw_min = 0
raw_max = 1000
home_raw = 762
startup_check_raw = 762
mapped_angle_at_raw_min = 0.0
mapped_angle_at_raw_max = 1000.0

[servos.servo3]
# 第三个舵机示例。
id = 3
position_step = 4
raw_min = 0
raw_max = 1000
home_raw = 758
startup_check_raw = 758
mapped_angle_at_raw_min = 0.0
mapped_angle_at_raw_max = 1000.0

[servos.servo4]
# 第四个舵机示例，可作为末端夹爪。
id = 4
position_step = 5
raw_min = 0
raw_max = 1000
mapped_angle_at_raw_min = 240.0
mapped_angle_at_raw_max = 0.0
