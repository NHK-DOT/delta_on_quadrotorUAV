# LX225 工具示例配置
# 目标：
# 1. 把常用参数尽量放到配置文件里，不要每次在命令行写一长串参数。
# 2. 把“硬件读写目标”和“本地映射显示规则”分开。
# 3. 本地映射只影响显示和换算，不会让舵机运动。
#
# 约定：
# 1. `raw_*` 是舵机协议里的原始位置值，通常可理解为官方软件看到的 0..1000。
# 2. `mapped_angle_*` 是你自己定义的角度坐标系，不必等于官方 0..240°。
# 3. `position_step` 是你希望量化到的原始步长。
#    - 1  表示最细
#    - 5  表示每 5 个 raw 量化一步
#    - 10 表示接近官方 UI 的常见步进

[serial]
# 实际连接舵机驱动板的串口。
# 注意不要填成 IMU 的串口。
port = "COM19"

# 波特率。
baudrate = 9600

# 串口读超时，单位秒。
timeout = 0.60

# 打开串口后的额外等待时间，单位秒。
connect_delay = 1.00

[defaults]
# 全局默认量化步长。
position_step = 4

[servos.servo1]
id = 1
position_step = 4
raw_min = 0
raw_max = 1000
home_raw = 750
startup_check_raw = 750
mapped_angle_at_raw_min = 0.0
mapped_angle_at_raw_max = 1000.0

[servos.servo2]
id = 2
position_step = 4
raw_min = 0
raw_max = 1000
home_raw = 762
startup_check_raw = 762
mapped_angle_at_raw_min = 0.0
mapped_angle_at_raw_max = 1000.0

[servos.servo3]
id = 3
position_step = 4
raw_min = 0
raw_max = 1000
home_raw = 758
startup_check_raw = 758
mapped_angle_at_raw_min = 0.0
mapped_angle_at_raw_max = 1000.0

[servos.servo4]
id = 4
position_step = 5
raw_min = 0
raw_max = 1000
mapped_angle_at_raw_min = 240.0
mapped_angle_at_raw_max = 0.0
